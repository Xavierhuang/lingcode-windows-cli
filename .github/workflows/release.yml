name: "Release LingCode CLI Windows"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App (Windows)
        run: pnpm tauri build

      - name: Prepare Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $VERSION = $env:GITHUB_REF_NAME
          
          # 1. MSI Installer
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter *.msi | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "release-assets/LingCode-CLI-$VERSION-Windows-Installer.msi"
          }

          # 2. Portable EXE
          $exe = "src-tauri/target/release/lingcode-cli.exe"
          if (Test-Path $exe) {
            $portableDir = "release-assets/LingCode-CLI-Portable"
            New-Item -ItemType Directory -Force -Path $portableDir
            Copy-Item $exe "$portableDir/lingcode.exe"
            # Add a marker for portable mode
            "# LingCode CLI portable" | Out-File -FilePath "$portableDir/portable.ini" -Encoding utf8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/LingCode-CLI-$VERSION-Windows-Portable.zip" -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "LingCode CLI ${{ github.ref_name }}"
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
