name: "Release LingCode CLI Windows"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App (Windows)
        run: pnpm tauri build

      - name: Prepare Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $VERSION = $env:GITHUB_REF_NAME

          # 1. NSIS Installer (.exe). Tauri writes it under bundle/nsis/.
          $nsis = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter *.exe | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "release-assets/LingCode-CLI-$VERSION-Windows-Setup.exe"
          }

          # 2. Portable EXE — the raw cargo output, no installer required.
          $exe = "src-tauri/target/release/lingcode-cli.exe"
          if (Test-Path $exe) {
            $portableDir = "release-assets/LingCode-CLI-Portable"
            New-Item -ItemType Directory -Force -Path $portableDir
            Copy-Item $exe "$portableDir/lingcode.exe"
            # Marker file consumed by the app at runtime to enable portable mode.
            "# LingCode CLI portable" | Out-File -FilePath "$portableDir/portable.ini" -Encoding utf8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/LingCode-CLI-$VERSION-Windows-Portable.zip" -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "LingCode CLI ${{ github.ref_name }}"
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
